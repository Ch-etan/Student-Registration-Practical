<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #db2777);
      padding: 20px;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    .card h2 { text-align: center; color: #1f2937; font-size: 26px; }
    .card p.sub { text-align: center; color: #6b7280; margin: 6px 0 26px; font-size: 14px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: #f9fafb;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input:focus, select:focus {
      border-color: #6366f1;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4); }
    button:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎓 Student Registration</h2>
    <p class="sub">Fill in your details to register</p>

    <form action="/register" method="post">
      <div class="field">
        <label for="name">Student Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Rahul Sharma" required>
      </div>

      <div class="field">
        <label for="roll">Roll Number</label>
        <input type="text" id="roll" name="roll" placeholder="e.g. 2024CS101" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="e.g. rahul@college.edu" required>
      </div>

      <div class="field">
        <label for="course">Course</label>
        <select id="course" name="course" required>
          <option value="" disabled selected>Select a course</option>
          <option>B.Tech Computer Science</option>
          <option>BCA</option>
          <option>MCA</option>
          <option>B.Sc IT</option>
          <option>MBA</option>
        </select>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
